# SPDX-License-Identifier: MIT
# Builds nup-loader.nro and resident plugin nupvfs.nso using ounce-devkit.
# Push to main/master publishes a commit-tagged release; tags (v* / YYYYMMDD*) publish versioned releases.
name: Build & Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
      - '[0-9]*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build nup-loader & nupvfs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Pull ounce-devkit image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/buildcontainer:latest"
          docker pull "$image"
          docker tag "$image" ounce-devkit:latest

      - name: Build nup-loader.nro and nupvfs.nso
        run: |
          git clone --depth=1 https://github.com/Doofenshmirtz-Homebrew-Incorporated/okaihen.git /tmp/okaihen
          docker run --rm -v "$PWD:/src" -v "/tmp/okaihen:/okaihen" -w /src ounce-devkit bash -euo pipefail -c '
            make -C /okaihen/libkaihen -j"$(nproc)"
            cp -r /okaihen/libkaihen/include/* /opt/devkitpro/portlibs/switch2/include/
            cp /okaihen/libkaihen/build/libkaihen.a /okaihen/libkaihen/build/libkaihen_plugin.a /opt/devkitpro/portlibs/switch2/lib/
            make -j"$(nproc)"
            make -C plugin -j"$(nproc)"
          '

      - name: Package release bundle
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${GITHUB_SHA}"
          fi
          mkdir -p dist/stage/kaihen/programs dist/stage/kaihen/plugins dist/stage/switch/nup-loader
          cp nup-loader.nro dist/stage/kaihen/programs/nup-loader.nro
          cp nup-loader.nro dist/stage/switch/nup-loader/nup-loader.nro
          cp plugin/nupvfs.nso dist/stage/kaihen/plugins/nupvfs.nso
          cp nup-loader.nro dist/nup-loader.nro
          cp plugin/nupvfs.nso dist/nupvfs.nso
          (cd dist/stage && zip -q -r -X "../nup-loader-${version}.zip" .)
          rm -rf dist/stage
          (cd dist && sha256sum "nup-loader-${version}.zip" nup-loader.nro nupvfs.nso > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nup-loader-${{ env.VERSION }}-${{ github.sha }}
          path: dist/

      - name: Publish GitHub Release (version tag or commit)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "nup-loader ${GITHUB_REF_NAME}" \
              --generate-notes \
              "dist/nup-loader-${VERSION}.zip" \
              dist/nup-loader.nro \
              dist/nupvfs.nso \
              dist/SHA256SUMS.txt
          else
            tag="build-${GITHUB_SHA}"
            zip="dist/nup-loader-${VERSION}.zip"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" --clobber \
                "$zip" dist/nup-loader.nro dist/nupvfs.nso dist/SHA256SUMS.txt
              gh release edit "$tag" \
                --prerelease=false \
                --title "nup-loader ${GITHUB_SHA::7}" \
                --notes "Build from commit ${GITHUB_SHA}."
            else
              gh release create "$tag" \
                --target "$GITHUB_SHA" \
                --title "nup-loader ${GITHUB_SHA::7}" \
                --notes "Build from commit ${GITHUB_SHA}." \
                "$zip" dist/nup-loader.nro dist/nupvfs.nso dist/SHA256SUMS.txt
            fi
          fi
